name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Source Files and Build APK
        run: |
          set +e
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1
          set -e

          rm -rf app
          mkdir -p app/src/main/java/com/smartcaptain/app
          mkdir -p app/src/main/res/values

          # Write RideModels.kt
          cat << 'EOF' > app/src/main/java/com/smartcaptain/app/RideModels.kt
          package com.smartcaptain.app
          enum class ServiceType { BIKE, AUTO, CAB, PARCEL }
          data class DriverRules(
              val serviceSwitchEnabled: Boolean = true,
              val minTripDistanceKm: Double = 5.0,
              val maxPickupDistanceKm: Double = 2.0,
              val minFareInr: Double = 60.0,
              val preferredDestination: String = "",
              val allowedServices: Set<ServiceType> = setOf(ServiceType.BIKE, ServiceType.AUTO, ServiceType.CAB, ServiceType.PARCEL)
          )
          data class RideOffer(
              val platform: String,
              val serviceType: ServiceType,
              val fareInr: Double,
              val pickupDistanceKm: Double,
              val tripDistanceKm: Double,
              val dropArea: String
          )
          data class FilterDecision(val matchesRules: Boolean, val reasons: List<String>)
          data class DriverStatusResponse(val phone: String, val passActive: Boolean, val statusText: String, val rules: DriverRules)
          EOF

          # Write RuleEngine.kt
          cat << 'EOF' > app/src/main/java/com/smartcaptain/app/RuleEngine.kt
          package com.smartcaptain.app
          class RuleEngine {
              fun evaluate(offer: RideOffer, rules: DriverRules, masterEnabled: Boolean, emergencyStopped: Boolean, passActive: Boolean): FilterDecision {
                  val reasons = mutableListOf<String>()
                  if (emergencyStopped) return FilterDecision(false, listOf("EMERGENCY STOP is active."))
                  if (!masterEnabled) return FilterDecision(false, listOf("Master switch is turned OFF."))
                  if (!passActive) return FilterDecision(false, listOf("Driver pass is not active."))
                  if (offer.fareInr < rules.minFareInr) reasons.add("Fare ₹${offer.fareInr} below min.")
                  return if (reasons.isEmpty()) FilterDecision(true, listOf("MATCH")) else FilterDecision(false, reasons)
              }
          }
          EOF

          # Write BackendClient.kt
          cat << 'EOF' > app/src/main/java/com/smartcaptain/app/BackendClient.kt
          package com.smartcaptain.app
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          class BackendClient(private val baseUrl: String = "https://smart-captain.onrender.com") {
              suspend fun fetchDriverStatus(phone: String): Result<DriverStatusResponse> = withContext(Dispatchers.IO) {
                  runCatching {
                      DriverStatusResponse(phone, true, "Active", DriverRules())
                  }
              }
              suspend fun saveRulesAndActivate(phone: String, plan: String, rules: DriverRules): Result<String> = withContext(Dispatchers.IO) {
                  runCatching { "Saved" }
              }
          }
          EOF

          # Write MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/smartcaptain/app/MainActivity.kt
          package com.smartcaptain.app
          import android.graphics.Color
          import android.os.Bundle
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 48, 40, 64)
                      setBackgroundColor(Color.parseColor("#0D1117"))
                  }
                  val title = TextView(this).apply {
                      text = "Smart Captain"
                      textSize = 22f
                      setTextColor(Color.WHITE)
                  }
                  root.addView(title)
                  setContentView(root)
              }
          }
          EOF

          printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "SmartCaptain"\ninclude(":app")\n' > settings.gradle.kts
          printf 'plugins {\n  id("com.android.application") version "8.4.0" apply false\n  id("org.jetbrains.kotlin.android") version "1.9.23" apply false\n}\n' > build.gradle.kts
          printf 'plugins {\n  id("com.android.application")\n  id("org.jetbrains.kotlin.android")\n}\nandroid {\n  namespace = "com.smartcaptain.app"\n  compileSdk = 34\n  defaultConfig {\n    applicationId = "com.smartcaptain.app"\n    minSdk = 26\n    targetSdk = 34\n    versionCode = 1\n    versionName = "1.0"\n  }\n  compileOptions {\n    sourceCompatibility = JavaVersion.VERSION_17\n    targetCompatibility = JavaVersion.VERSION_17\n  }\n  kotlinOptions {\n    jvmTarget = "17"\n  }\n}\ndependencies {\n  implementation("androidx.core:core-ktx:1.12.0")\n  implementation("androidx.appcompat:appcompat:1.6.1")\n  implementation("com.google.android.material:material:1.11.0")\n  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")\n}\n' > app/build.gradle.kts
          printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\n' > gradle.properties
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n  <uses-permission android:name="android.permission.INTERNET" />\n  <application android:allowBackup="true" android:label="Smart Captain" android:supportsRtl="true" android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">\n    <activity android:name=".MainActivity" android:exported="true">\n      <intent-filter>\n        <action android:name="android.intent.action.MAIN" />\n        <category android:name="android.intent.category.LAUNCHER" />\n      </intent-filter>\n    </activity>\n  </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml
          printf '<resources><string name="app_name">Smart Captain</string></resources>\n' > app/src/main/res/values/strings.xml

          gradle assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-captain-debug-apk
          path: app/build/outputs/apk/debug/*.apk
