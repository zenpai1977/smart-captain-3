name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses and Install SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Organize Project Structure Safely
        run: |
          mkdir -p app/src/main/java/com/smartcaptain/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/test/java/com/smartcaptain/app

          for f in MainActivity.kt RideRules.kt RideOfferParser.kt RideModels.kt RuleEngine.kt BackendClient.kt; do
            if [ -f "$f" ]; then cp "$f" "app/src/main/java/com/smartcaptain/app/$f"; fi
          done

          for f in RideRuleEngineTest.kt RideOfferParserTest.kt RuleEngineTest.kt; do
            if [ -f "$f" ]; then cp "$f" "app/src/test/java/com/smartcaptain/app/$f"; fi
          done

          if [ -f "strings.xml" ]; then cp "strings.xml" "app/src/main/res/values/strings.xml"; fi
          if [ -f "AndroidManifest.xml" ] && [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cp "AndroidManifest.xml" "app/src/main/AndroidManifest.xml"
          fi

          printf "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\n" > gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: List Project Files for Verification
        run: |
          ls -la
          ls -la app/
          ls -la app/src/main/java/com/smartcaptain/app/

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-captain-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
