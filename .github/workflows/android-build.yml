name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Auto-Organize Flat Root Files into Gradle Structure
        run: |
          mkdir -p app/src/main/java/com/smartcaptain/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/test/java/com/smartcaptain/app

          # Move standalone Kotlin source files from root if present
          for f in MainActivity.kt RideRules.kt RideOfferParser.kt RideModels.kt RuleEngine.kt BackendClient.kt; do
            if [ -f "$f" ]; then
              cp "$f" "app/src/main/java/com/smartcaptain/app/$f"
            fi
          done

          # Move unit test files from root if present
          for f in RideRuleEngineTest.kt RideOfferParserTest.kt RuleEngineTest.kt; do
            if [ -f "$f" ]; then
              cp "$f" "app/src/test/java/com/smartcaptain/app/$f"
            fi
          done

          # Move strings.xml if present in root
          if [ -f "strings.xml" ]; then
            cp "strings.xml" "app/src/main/res/values/strings.xml"
          fi

          # Create a clean standalone AndroidManifest.xml if missing in app/src/main
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Smart Captain"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

          # Ensure settings.gradle.kts is valid
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartCaptain"
          include(":app")
          EOF

          # Ensure gradle.properties has AndroidX enabled
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # Handle build.gradle.kts (Root vs App module)
          if [ ! -f "app/build.gradle.kts" ]; then
            if grep -q "compileSdk" build.gradle.kts 2>/dev/null; then
              cp build.gradle.kts app/build.gradle.kts
            else
              cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.smartcaptain.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.smartcaptain.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              testImplementation("junit:junit:4.13.2")
          }
          EOF
            fi
          fi

          # Write clean root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify organized project files
        run: |
          ls -la app/src/main/java/com/smartcaptain/app/
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/smartcaptain/app/MainActivity.kt

      - name: Test and build APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-captain-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
