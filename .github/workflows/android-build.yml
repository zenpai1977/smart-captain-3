name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Clean Android Structure and Build APK
        run: |
          set +e
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1
          set -e

          mkdir -p /tmp/sc_src
          find . -maxdepth 5 -type f -name "MainActivity.kt*" -exec cp {} /tmp/sc_src/MainActivity.kt \;
          find . -maxdepth 5 -type f -name "RideRules.kt*" -exec cp {} /tmp/sc_src/RideRules.kt \;
          find . -maxdepth 5 -type f -name "RideOfferParser.kt*" ! -name "*Test*" -exec cp {} /tmp/sc_src/RideOfferParser.kt \;
          find . -maxdepth 5 -type f -name "RideModels.kt*" -exec cp {} /tmp/sc_src/RideModels.kt \;
          find . -maxdepth 5 -type f -name "RuleEngine.kt*" ! -name "*Test*" -exec cp {} /tmp/sc_src/RuleEngine.kt \;
          find . -maxdepth 5 -type f -name "BackendClient.kt*" -exec cp {} /tmp/sc_src/BackendClient.kt \;
          find . -maxdepth 5 -type f -name "strings.xml*" -exec cp {} /tmp/sc_src/strings.xml \;

          rm -rf app
          mkdir -p app/src/main/java/com/smartcaptain/app
          mkdir -p app/src/main/res/values
          cp /tmp/sc_src/*.kt app/src/main/java/com/smartcaptain/app/

          if [ -f /tmp/sc_src/strings.xml ]; then
            cp /tmp/sc_src/strings.xml app/src/main/res/values/strings.xml
          else
            printf '<resources><string name="app_name">Smart Captain</string></resources>\n' > app/src/main/res/values/strings.xml
          fi

          printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "SmartCaptain"\ninclude(":app")\n' > settings.gradle.kts

          printf 'plugins {\n  id("com.android.application") version "8.4.0" apply false\n  id("org.jetbrains.kotlin.android") version "1.9.23" apply false\n}\n' > build.gradle.kts

          printf 'plugins {\n  id("com.android.application")\n  id("org.jetbrains.kotlin.android")\n}\nandroid {\n  namespace = "com.smartcaptain.app"\n  compileSdk = 34\n  defaultConfig {\n    applicationId = "com.smartcaptain.app"\n    minSdk = 26\n    targetSdk = 34\n    versionCode = 1\n    versionName = "1.0"\n  }\n  compileOptions {\n    sourceCompatibility = JavaVersion.VERSION_17\n    targetCompatibility = JavaVersion.VERSION_17\n  }\n  kotlinOptions {\n    jvmTarget = "17"\n  }\n}\ndependencies {\n  implementation("androidx.core:core-ktx:1.12.0")\n  implementation("androidx.appcompat:appcompat:1.6.1")\n  implementation("com.google.android.material:material:1.11.0")\n  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")\n}\n' > app/build.gradle.kts

          printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\n' > gradle.properties

          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n  <uses-permission android:name="android.permission.INTERNET" />\n  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n  <application android:allowBackup="true" android:label="@string/app_name" android:supportsRtl="true" android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">\n    <activity android:name=".MainActivity" android:exported="true">\n      <intent-filter>\n        <action android:name="android.intent.action.MAIN" />\n        <category android:name="android.intent.category.LAUNCHER" />\n      </intent-filter>\n    </activity>\n  </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml

          ls -la app/src/main/java/com/smartcaptain/app/
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-captain-debug-apk
          path: app/build/outputs/apk/debug/*.apk
